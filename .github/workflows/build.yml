name: Build GlobalGestureTool (Rootless)
on:
  push:
  workflow_dispatch: # ✅ 就是这一行！开启网页手动运行，解决你【工作流不存在/无dispatch触发器】报错

jobs:
  build_tweak:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_PATH

      - name: Download iPhoneOS17.0 SDK
        run: |
          cd $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git temp_sdk
          mv temp_sdk/iPhoneOS17.0.sdk ./
          rm -rf temp_sdk

      - name: Build Tweak & Package deb
        run: |
          make clean
          make package

      - name: Upload deb as Artifact（打包成功后，可以在这里下载deb）
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-rootless-deb
          path: packages/*.deb