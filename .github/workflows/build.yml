name: Build GlobalGestureTool (Rootless)
on:
  push:
  workflow_dispatch:

jobs:
  build_tweak:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Theos official installer
        run: |
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos | bash
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_PATH

      - name: Build Tweak & Package deb
        run: |
          make clean
          make package

      - name: Upload deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-rootless-deb
          path: packages/*.deb