name: Build GlobalGestureTool Rootless arm64e
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SDK_VERSION: "17.0"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ env.THEOS }}

      - name: Install dependencies ldid dpkg
        run: |
          brew install ldid dpkg

      - name: Update Theos & download patched SDK
        run: |
          export THEOS=${{ env.THEOS }}
          export PATH="$THEOS/bin:$PATH"
          update-theos

      - name: Compile & Package deb
        run: |
          export THEOS=${{ env.THEOS }}
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 SDKVERSION=${{ env.SDK_VERSION }}

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-Deb
          path: packages/*.deb