name: Build GlobalGestureTool Rootless arm64e
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      # ✅ 修改为仓库内存在的 iPhoneOS16.5.sdk
      - name: Checkout SDK 16.5
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dependencies
        run: |
          brew install make ldid xz
          echo "THEOS=$PWD/theos" >> $GITHUB_ENV

      - name: Build deb
        run: make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb