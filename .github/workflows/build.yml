name: Build GlobalGestureTool Rootless arm64e
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout SDK 16.5
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dependencies
        run: |
          brew install ldid dpkg gnu-sed

      # ✅ 修复路径版本
      - name: Build GestureManager App Binary
        run: |
          export THEOS=$PWD/theos
          cd GestureManager
          make clean
          make ARCHS=arm64e TARGET=iphone:clang:16.5:14.5 THEOS_PACKAGE_SCHEME=rootless
          cd ..
          mkdir -p layout/var/jb/Applications/GestureManager.app/
          cp GestureManager/.theos/_/Applications/GestureManager.app/GestureManager layout/var/jb/Applications/GestureManager.app/GestureManager

      - name: Run make package FINALPACKAGE=1
        run: |
          export THEOS=$PWD/theos
          make package FINALPACKAGE=1

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-deb
          path: packages/*.deb