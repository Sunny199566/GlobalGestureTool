name: Build GlobalGestureTool (Rootless)
on:
  push:
  workflow_dispatch:

jobs:
  build_tweak:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_PATH

      - name: Download SDK repo (Official zip method)
        run: |
          cd $THEOS/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/iPhoneOS17.0.sdk ./
          rm -rf sdks-master master.zip

      - name: Build Tweak & Package deb
        run: |
          make clean
          make package

      - name: Upload deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-rootless-deb
          path: packages/*.deb