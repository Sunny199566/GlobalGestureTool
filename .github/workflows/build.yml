name: Build GlobalGestureTool (Rootless)
on:
  push:
  workflow_dispatch:

jobs:
  build_tweak:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_PATH

      - name: Download iPhoneOS17.0 SDK (Direct single file download)
        run: |
          cd $THEOS/sdks
          curl -L -o iPhoneOS17.0.sdk.tar.xz https://github.com/theos/sdks/raw/master/iPhoneOS17.0.sdk.tar.xz
          tar -xf iPhoneOS17.0.sdk.tar.xz
          rm iPhoneOS17.0.sdk.tar.xz

      - name: Build Tweak & Package deb
        run: |
          make clean
          make package

      - name: Upload deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-rootless-deb
          path: packages/*.deb