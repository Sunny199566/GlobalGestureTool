name: Build GlobalGestureTool Rootless arm64e
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout SDK 16.5
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dependencies
        run: |
          brew install ldid dpkg make

      - name: Setup Theos env
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Build all subprojects
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make clean
          make package FINALPACKAGE=1

      # ✅ 改动重点：从整个仓库根目录搜索GestureManager.app，不再限定GestureManager/.theos
      - name: Copy GestureManager app into layout & delete .gitkeep
        run: |
          mkdir -p layout/Applications/
          find . -name "GestureManager.app" -type d -exec cp -R {} layout/Applications/ \;
          find layout -name ".gitkeep" -delete

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-Deb
          path: ./packages/*.deb