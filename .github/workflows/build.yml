name: Build GlobalGestureTool (Rootless)
on:
  push:
  workflow_dispatch:

jobs:
  build_tweak:
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Clone Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_PATH

      - name: Install p7zip
        run: brew install p7zip

      - name: Download & extract SDK repo, move all sdk folders
        run: |
          cd $THEOS/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          7z x master.zip -y
          SDK_FOLDER=$(find . -maxdepth 1 -type d -name "sdks-*")
          mv $SDK_FOLDER/*.sdk ./
          rm -rf $SDK_FOLDER master.zip

      - name: Build Tweak & Package deb
        run: |
          make clean
          make package

      - name: Upload deb as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-rootless-deb
          path: packages/*.deb