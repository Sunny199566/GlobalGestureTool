name: Build GlobalGestureTool Rootless arm64e
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout SDK 16.5
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dependencies
        run: |
          brew install ldid dpkg make zip

      - name: Setup Theos env
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      # ========== 第一步：编译越狱deb包（RecordTweak + PlayDaemon）==========
      - name: Build deb package (Tweak & Daemon)
        run: |
          make clean
          make package FINALPACKAGE=1

      # ========== 第二步：GestureManager make stage + 手动zip打包IPA ==========
      - name: Build GestureManager IPA for TrollStore
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          cd GestureManager
          make clean
          make stage
          APP_PATH=$(find .theos/_/Applications -name "GestureManager.app" -type d)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r GestureManager.ipa Payload
          cp GestureManager.ipa $GITHUB_WORKSPACE/

      # ========== 上传全部构建产物（deb + ipa）==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-Build
          path: |
            ./packages/*.deb
            ./*.ipa
          retention-days: 30