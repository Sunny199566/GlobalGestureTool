name: Build GlobalGestureTool Rootless arm64e
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout SDK 16.5
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Install dependencies
        run: |
          brew install ldid dpkg make zip

      - name: Setup Theos env
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      # ========== 编译deb（RecordTweak + PlayDaemon） ==========
      - name: Build deb package (Tweak & Daemon)
        run: |
          make clean
          make package FINALPACKAGE=1

      # ========== 【全新方案】只编译二进制，手动组装完整IPA包 ==========
      - name: Build GestureManager binary & manually construct IPA
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          cd GestureManager
          make clean
          # 只编译链接，只拿可执行文件，不使用stage
          make all
          # 创建标准IPA目录结构 Payload/GestureManager.app
          rm -rf Payload
          mkdir -p Payload/GestureManager.app
          # 拷贝编译出来的可执行文件
          cp GestureManager Payload/GestureManager.app/
          # 直接拷贝Info.plist（仓库里的文件，百分百存在）
          cp Info.plist Payload/GestureManager.app/
          # ldid签名
          ldid -s Payload/GestureManager.app/GestureManager
          # zip打包成标准IPA
          zip -r GestureManager.ipa Payload
          # 复制到仓库根目录用于上传artifact
          cp GestureManager.ipa $GITHUB_WORKSPACE/

      # ========== 上传产物 deb + ipa ==========
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GlobalGestureTool-Build
          path: |
            ./packages/*.deb
            ./*.ipa
          retention-days: 30